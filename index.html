
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yifei's Playlist</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3eee8;
      color: #352e38;
      font-family: sans-serif;
    }
    main {
      width: min(82%, 360px);
      padding: 28px;
      border-radius: 24px;
      background: #fffaf5;
      box-shadow: 0 12px 40px #00000012;
    }
    h1 { font-size: 27px; }
    .sub { color: #897e88; font-size: 14px; }
    .track {
      margin-top: 24px;
      padding: 16px;
      background: #f3eee8;
      border-radius: 16px;
    }
    audio { width: 100%; margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <p class="sub">A LITTLE CORNER OF MUSIC</p>
    <h1>Yifei's Playlist ♡</h1>
    <p class="sub">Songs and memories, just for you.</p>

    <section class="track">
      <strong>01 · Owen</strong>
      <p class="sub">A personal recording</p>
      <audio controls preload="none">
        <source
          src="https://raw.githubusercontent.com/Yifei0403/NFC-Music/main/owen.m4a"
          type="audio/mp4">
        Your browser does not support audio playback.
      </audio>
    </section>
  </main>
</body>
</html>
